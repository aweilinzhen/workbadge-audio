.ai-prompt-card span {flex:1;min-width:0;}
.ai-prompt-card svg {flex:none;color:#111111;}
.ai-panel-spacer {flex:1;min-height:12px;}
.ai-panel-bottom {flex:none;padding:8px 17px calc(14px + env(safe-area-inset-bottom));}
.ai-input-capsule {height:59px;display:flex;align-items:center;gap:10px;padding:6px 7px 6px 12px;border:1px solid #F0F0F1;border-radius:99px;background:#FFFFFF;box-shadow:0 5px 18px rgba(29,32,39,.10);}
.ai-input-capsule button {width:40px;height:40px;flex:none;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:#17181A;}
.ai-input-capsule button svg {width:26px;height:26px;}
.ai-input-capsule .ai-send-button {background:#17181A;color:#FFFFFF;}
.ai-input-capsule [hidden] {display:none!important;}
.ai-input-capsule input {height:100%;min-width:0;flex:1;border:0;outline:0;padding:0 8px;background:transparent;color:#333333;font-size:16px;}
.ai-input-capsule input::placeholder {color:#9B9DA4;}
.ai-voice-active {background:#E6E6E7!important;}
.ai-disclaimer {margin:11px 0 0;text-align:center;color:#A0A1A7;font-size:12px;line-height:18px;}
.ai-panel-root {position:fixed;inset:0 0 var(--ai-keyboard-inset,0px);left:50%;right:auto;width:min(100vw,470px);z-index:10000;transform:translateX(-50%);justify-content:center;padding-bottom:0;}
.ai-panel {height:calc(100% - max(30px, env(safe-area-inset-top)));min-height:min(420px, calc(100% - max(30px, env(safe-area-inset-top))));}
.ai-panel-root.ai-panel-expanded {align-items:stretch;padding:0;background:#FFFFFF;}
.ai-panel-root.ai-panel-expanded .ai-panel {height:100%;min-height:0;border-radius:0;box-shadow:none;}
.ai-panel-expanded .ai-panel-grabber {margin-top:calc(11px + env(safe-area-inset-top));}
.ai-panel-expanded .ai-panel-expand-icon {transform:rotate(180deg);}
.ai-panel-bottom {padding-bottom:calc(10px + env(safe-area-inset-bottom));}
.ai-panel-hint:empty {display:none;}
.ai-launcher-form button {pointer-events:none;}
.ai-prompt-card:active,.ai-panel-icon-button:active,.ai-input-capsule button:active {transform:scale(.98);}
.ai-voice-status {color:#55585f;}
.ai-expand-button svg {transform:rotate(180deg);}
.ai-panel-actions {display:flex;align-items:center;gap:7px;}
.ai-panel-header {grid-template-columns:46px 1fr auto;}
.ai-panel-more-wrap {position:relative;}
.ai-panel-expanded .ai-panel-actions .ai-panel-icon-button {width:58px;height:58px;color:#333333;}
.ai-panel-expanded .ai-panel-actions .ai-panel-icon-button svg {width:22px;height:22px;}
.ai-history-page {position:absolute;inset:56px 0 0;z-index:220;display:flex;flex-direction:column;overflow:hidden;background:#F4F4F5;color:#242529;}
.ai-history-topbar {height:74px;flex:none;display:flex;align-items:center;gap:17px;padding:0 20px;}
.ai-history-back {width:42px;height:42px;flex:none;display:grid;place-items:center;border:0;border-radius:50%;background:#FFFFFF;color:#333333;box-shadow:0 3px 12px rgba(20,22,28,.05);}
.ai-history-topbar h1 {margin:0;font-size:22px;font-weight:650;letter-spacing:-.3px;}
.ai-history-body {flex:1;min-height:0;overflow-y:auto;padding:10px 20px 140px;scrollbar-width:none;}
.ai-history-body::-webkit-scrollbar,.ai-history-detail-messages::-webkit-scrollbar {display:none;}
.ai-history-heading {display:flex;align-items:center;justify-content:space-between;margin:34px 0 24px;}
.ai-history-heading strong {font-size:18px;font-weight:650;}
.ai-history-search {padding:4px 0;border:0;background:transparent;color:#8B8D94;font-size:14px;}
.ai-history-day {margin:0 0 12px;color:#9698A0;font-size:14px;}
.ai-history-list {display:grid;gap:22px;}
.ai-history-item {min-width:0;}
.ai-history-row {display:flex;align-items:center;gap:8px;min-width:0;}
.ai-history-record {flex:1;min-width:0;padding:8px 0;border:0;background:transparent;color:#292A2D;text-align:left;}
.ai-history-record strong {display:block;overflow:hidden;margin-bottom:8px;font-size:18px;font-weight:570;text-overflow:ellipsis;white-space:nowrap;}
.ai-history-record small {display:block;overflow:hidden;color:#9698A0;font-size:13px;line-height:1.5;text-overflow:ellipsis;white-space:nowrap;}
.ai-history-more {width:32px;height:38px;flex:none;display:grid;place-items:center;border:0;background:transparent;color:#8D8F96;}
.ai-history-notice {margin:14px 0 0;color:#7D7F86;text-align:center;font-size:13px;}
.ai-history-new {position:absolute;z-index:2;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:center;gap:10px;width:200px;height:60px;padding:0 22px;transform:translateX(-50%);border:0;border-radius:99px;background:#111216;color:#FFFFFF;font-size:17px;font-weight:560;box-shadow:0 5px 16px rgba(10,11,13,.12);}
.ai-history-new svg {width:22px;height:22px;}
.ai-history-empty {margin:30px 0;color:#9698A0;text-align:center;font-size:14px;}
.ai-history-menu {width:128px;overflow:hidden;margin:0 8px 0 auto;border:1px solid #EEEEF0;border-radius:12px;background:#FFFFFF;box-shadow:0 5px 18px rgba(24,25,30,.12);}
.ai-history-menu button {display:block;width:100%;height:44px;padding:0 15px;border:0;background:#FFFFFF;color:#333438;text-align:left;font-size:14px;}
.ai-history-menu button+button {border-top:1px solid #F0F0F2;color:#777980;}
.ai-history-overlay {position:absolute;inset:0;z-index:260;display:grid;place-items:center;padding:24px;background:rgba(25,26,30,.28);}
.ai-history-dialog {width:min(100%,360px);padding:22px;border:1px solid #EEEEF0;border-radius:20px;background:#FFFFFF;box-shadow:0 14px 42px rgba(20,22,28,.18);}
.ai-history-dialog h2 {margin:0 0 17px;color:#292A2D;font-size:19px;font-weight:650;}
.ai-history-dialog p {margin:0 0 20px;color:#55575E;font-size:15px;line-height:1.6;}
.ai-history-dialog input {width:100%;height:46px;padding:0 13px;border:1px solid #E4E4E7;border-radius:11px;background:#FAFAFB;color:#333438;font-size:15px;}
.ai-history-dialog-actions {display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
.ai-history-dialog-actions button {min-width:82px;height:40px;padding:0 15px;border:1px solid #E4E4E7;border-radius:11px;background:#FFFFFF;color:#55575E;font-size:14px;}
.ai-history-dialog-actions button.primary {border-color:#333438;background:#333438;color:#FFFFFF;}
.ai-search-list {display:grid;gap:15px;margin-top:17px;}
.ai-search-item {padding:15px 0;border-bottom:1px solid #E8E8EA;}
.ai-search-item strong {display:block;margin-bottom:6px;font-size:16px;}
.ai-search-item small {color:#8B8D94;font-size:13px;}
.ai-history-home-indicator {position:absolute;bottom:max(8px,env(safe-area-inset-bottom,0px));left:50%;width:35%;max-width:146px;height:5px;transform:translateX(-50%);border-radius:99px;background:#111111;}
.ai-history-detail-messages {flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:13px;padding:16px 20px calc(20px + env(safe-area-inset-bottom,0px));scrollbar-width:none;}
.ai-history-detail-messages .ai-history-bubble {max-width:88%;padding:13px 15px;border-radius:18px;background:#FFFFFF;color:#333438;font-size:15px;line-height:1.65;white-space:pre-wrap;}
.ai-history-detail-messages .ai-history-bubble.user {align-self:flex-end;background:#333438;color:#FFFFFF;border-bottom-right-radius:6px;}
.main-content:has(.assistant-ai-screen),.main-content:has(.ai-history-inline) {height:calc(100dvh - 164px - env(safe-area-inset-bottom,0px));min-height:0;padding:0;overflow:hidden;}
.assistant-ai-screen {height:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden;padding:0 18px 10px;background:#FFFFFF;color:#292A2D;}
.assistant-ai-header {height:78px;flex:none;display:grid;grid-template-columns:58px 1fr 58px;align-items:center;gap:8px;}
.assistant-ai-header h1 {margin:0;text-align:center;color:#17181A;font-size:20px;font-weight:700;}
.assistant-ai-header .assistant-ai-right-button {width:58px;height:58px;display:grid;place-items:center;border:0;border-radius:50%;background:#FFFFFF;color:#333333;box-shadow:0 3px 12px rgba(20,22,28,.06);}
.assistant-ai-prompts {display:grid;gap:11px;overflow-y:auto;flex:none;padding:19px 5px 12px;scrollbar-width:none;}
.assistant-ai-spacer {flex:1;min-height:12px;}
.assistant-ai-bottom {flex:none;padding:8px 5px 0;}
.assistant-ai-bottom .ai-input-capsule {height:64px;padding-left:16px;box-shadow:0 3px 16px rgba(20,22,28,.07);}
.assistant-ai-bottom .ai-disclaimer {display:none;}
.ai-history-page.ai-history-inline {position:relative;inset:auto;z-index:auto;width:100%;height:100%;}
.ai-history-page.ai-history-inline .ai-history-new {bottom:17px;}
.ai-history-page.ai-history-inline .ai-history-home-indicator {display:none;}
.ai-fullscreen {position:absolute;inset:56px 0 var(--ai-keyboard-inset,0px);min-height:0;z-index:201;display:flex;flex-direction:column;overflow:hidden;background:#F4F4F5;color:#26272A;animation:ai-panel-up .24s ease-out;}
.ai-fullscreen::after {content:'';position:absolute;z-index:3;left:50%;bottom:max(7px,env(safe-area-inset-bottom,0px));width:35%;max-width:146px;height:5px;transform:translateX(-50%);border-radius:99px;background:#111111;pointer-events:none;}
.ai-full-topbar {height:54px;flex:none;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:0 18px;}
.ai-full-icon {width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:50%;background:#FFFFFF;color:#333333;box-shadow:0 3px 12px rgba(20,22,28,.06);}
.ai-full-icon svg {width:22px;height:22px;}
.ai-full-topbar-spacer {width:40px;}
.ai-full-hero {flex:none;display:flex;flex-direction:column;align-items:center;padding:5px 0 17px;}
.ai-full-avatar {width:54px;height:54px;display:grid;place-items:center;border-radius:50%;background:#E6E6E7;}
.ai-full-avatar svg {width:39px;height:39px;}
.ai-full-name {margin-top:5px;padding:4px 18px;border:1px solid #EEEEEF;border-radius:99px;background:#FFFFFF;font-size:16px;font-weight:600;line-height:23px;}
.ai-full-time {margin:12px 0 0;color:#9A9BA1;font-size:14px;}
.ai-full-messages {flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:12px 20px 20px;display:flex;flex-direction:column;gap:13px;scrollbar-width:none;}
.ai-full-messages::-webkit-scrollbar {display:none;}
.ai-recording-card {width:min(82%,390px);align-self:flex-end;display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid #EEEEEF;border-radius:19px;background:#FFFFFF;color:#333333;text-align:left;box-shadow:0 3px 12px rgba(20,22,28,.035);}
.ai-recording-icon {width:44px;height:44px;flex:none;display:grid;place-items:center;border:1px solid #EEEEEF;border-radius:14px;background:#FFFFFF;}
.ai-recording-copy {min-width:0;display:flex;flex-direction:column;gap:3px;}
.ai-recording-copy strong {overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;font-weight:600;}
.ai-recording-copy small {color:#929399;font-size:12px;}
.ai-full-user {max-width:88%;align-self:flex-end;padding:13px 16px;border-radius:22px 7px 22px 22px;background:#222326;color:#FFFFFF;font-size:16px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;}
.ai-full-assistant {max-width:94%;align-self:flex-start;padding:17px 16px;border-radius:8px 22px 22px 22px;background:#FFFFFF;color:#28292C;font-size:15px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 3px 14px rgba(20,22,28,.035);}
.ai-full-replies {display:grid;gap:9px;margin-top:-2px;}
.ai-full-reply {min-height:50px;display:flex;align-items:center;gap:10px;padding:10px 13px 10px 16px;border:0;border-radius:17px;background:#FFFFFF;color:#393A3D;text-align:left;font-size:14px;line-height:1.45;box-shadow:0 2px 10px rgba(20,22,28,.03);}
.ai-full-reply span {flex:1;}
.ai-full-reply svg {flex:none;color:#55565A;}
.ai-full-bottom {flex:none;width:100%;min-width:0;padding:10px 12px calc(24px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(244,244,245,0),#F4F4F5 12%);}
.ai-full-bottom .ai-input-capsule {height:64px;gap:9px;padding:6px 8px 6px 16px;box-shadow:0 3px 16px rgba(20,22,28,.07);}
.ai-full-bottom .ai-input-capsule input {padding:0 2px;}
.ai-full-bottom .ai-input-capsule .ai-voice-button {width:46px;height:46px;border-radius:50%;background:#F4F4F5;color:#333333;}
.ai-full-bottom .ai-input-capsule .ai-voice-button svg {width:25px;height:25px;}
.ai-full-bottom .ai-disclaimer {margin-top:8px;}
/* Lift only the composer and its note; keep the shortcut row exactly where it is.
   The bottom container already reserves the iOS safe area, so this extra gap
   keeps the capsule's lower edge clear of both the viewport edge and indicator. */
.ai-full-bottom .ai-full-input-capsule,.ai-full-bottom > .ai-disclaimer {position:relative;transform:translateY(-12px);}
.ai-full-replies {display:flex;gap:8px;width:100%;min-width:0;margin:0 0 16px;overflow:hidden;}
.ai-full-reply {flex:1 1 0;min-width:0;min-height:48px;justify-content:space-between;gap:4px;padding:6px 8px;border-radius:999px;font-size:11px;line-height:1.2;}
.ai-full-reply span {min-width:0;white-space:normal;overflow-wrap:anywhere;text-align:center;}
.ai-full-reply svg {width:15px;height:15px;}
.ai-full-reply .ai-reply-leading {width:14px;height:14px;flex:none;}
.ai-full-messages,.ai-full-bottom {overflow-x:clip;}
@media (max-width:360px) {
 .ai-full-messages {padding-left:14px;padding-right:14px;}
 .ai-full-bottom {padding-left:9px;padding-right:9px;}
 .ai-full-replies {gap:6px;}
 .ai-full-reply {gap:3px;padding-left:5px;padding-right:5px;font-size:10px;}
 .ai-full-reply .ai-reply-leading,.ai-full-reply svg {width:14px;height:14px;}
}
.ai-full-hint {margin:0 0 6px;text-align:center;color:#777980;font-size:12px;}
.ai-insight-backdrop {position:absolute;inset:0;z-index:10;display:grid;place-items:center;padding:24px;background:rgba(24,25,28,.44);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);}
.ai-insight-card {width:min(100%,390px);max-height:min(72dvh,640px);display:flex;flex-direction:column;overflow:hidden;border:1px solid #EEEEEF;border-radius:24px;background:#FFFFFF;color:#333333;box-shadow:0 18px 48px rgba(20,22,28,.18);animation:fade-in .18s ease-out;}
.ai-insight-header {flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 20px 13px;}
.ai-insight-header h2 {margin:0;font-size:19px;font-weight:650;}
.ai-insight-close {width:34px;height:34px;flex:none;display:grid;place-items:center;border:0;border-radius:50%;background:#F3F3F4;color:#333333;}
.ai-insight-content {min-height:100px;flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 20px 18px;color:#55565A;font-size:15px;line-height:1.75;white-space:pre-wrap;}
.ai-insight-content p {margin:0 0 12px;}
.ai-insight-content p:last-child {margin-bottom:0;}
.ai-insight-loading {min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#777980;text-align:center;}
.ai-insight-spinner {width:28px;height:28px;border:2.5px solid #E5E5E6;border-top-color:#444548;border-radius:50%;animation:spin .8s linear infinite;}
.ai-insight-footer {flex:none;padding:12px 20px max(16px,env(safe-area-inset-bottom));border-top:1px solid #F0F0F1;}
.ai-insight-done {width:100%;height:46px;border:0;border-radius:99px;background:#333333;color:#FFFFFF;font-size:15px;font-weight:600;}
.ai-panel-root.ai-mode-fullscreen {background:#F4F4F5;animation:none;}
.ai-panel-root.ai-mode-fullscreen {inset:0;}
.app-shell.ai-keyboard-open .ai-fullscreen::after {display:none;}
.app-shell.ai-keyboard-open .ai-full-topbar {height:42px;}
.app-shell.ai-keyboard-open .ai-full-icon {width:34px;height:34px;}
.app-shell.ai-keyboard-open .ai-full-hero {padding:0 0 5px;}
.app-shell.ai-keyboard-open .ai-full-avatar {width:34px;height:34px;}
.app-shell.ai-keyboard-open .ai-full-avatar svg {width:27px;height:27px;}
.app-shell.ai-keyboard-open .ai-full-name {margin-top:2px;padding:2px 13px;font-size:14px;line-height:20px;}
.app-shell.ai-keyboard-open .ai-full-time {margin-top:4px;font-size:12px;}
.app-shell.ai-keyboard-open .ai-full-bottom {padding:4px 9px 8px;}
.app-shell.ai-keyboard-open .ai-full-reply {min-height:40px;}
.app-shell.ai-keyboard-open .ai-full-replies {margin-bottom:12px;}
.app-shell.ai-keyboard-open .ai-full-bottom .ai-input-capsule {height:56px;}
.app-shell.ai-keyboard-open .ai-full-bottom .ai-input-capsule .ai-voice-button {width:42px;height:42px;}
.app-shell.ai-keyboard-open .ai-full-bottom .ai-disclaimer {margin-top:4px;font-size:11px;}
.app-shell.ai-keyboard-open .ai-full-bottom .ai-full-input-capsule,.app-shell.ai-keyboard-open .ai-full-bottom > .ai-disclaimer {transform:translateY(-8px);}
@keyframes ai-panel-up {from{transform:translateY(32px);opacity:.92}to{transform:translateY(0);opacity:1}}
.profile-page {padding-top:13px; padding-bottom:calc(112px + env(safe-area-inset-bottom));}
.profile-page h1 {margin-bottom:23px;}
.profile-card {width:100%; min-height:116px; display:flex; gap:17px; align-items:center; background:#FFFFFF; border:1px solid #EEEEEE; border-radius:24px; padding:19px 20px; margin:0 0 24px; text-align:left; color:#333333; box-shadow:0 5px 18px rgba(0,0,0,.035);}
.profile-avatar {position:relative;display:grid; place-items:center; flex:none; width:80px; height:80px; padding:0;border:0;border-radius:50%; background:#EEEEEE; color:#555555; overflow:hidden;}
.profile-avatar img {display:block;width:100%;height:100%;object-fit:cover;border-radius:50%;}
.profile-card[role="button"] {cursor:pointer;}
.profile-card-copy {display:flex; min-width:0; flex:1; flex-direction:column; gap:5px;}
.profile-card strong {font-size:22px; font-weight:700; letter-spacing:-.45px; color:#333333;}.profile-card-copy>span {font-size:16px; color:#888888;}.profile-card .row-chevron {color:#666666; flex:none;}
.profile-settings-card {background:#FFFFFF; border:1px solid #EEEEEE; border-radius:24px; padding:10px 20px; box-shadow:0 5px 18px rgba(0,0,0,.035);}
.profile-setting-row {width:100%; height:72px; min-height:72px; display:flex; align-items:center; gap:16px; padding:0; border:0; color:#333333; background:transparent; text-align:left; position:relative;}
.profile-setting-row::after {content:'';position:absolute;bottom:0;left:44px;right:0;height:1px;background:#EEEEEE;}
.profile-setting-row:last-child::after {display:none;}
.profile-setting-row > svg:first-child {width:24px;height:24px; flex:none; color:#444444;}
.profile-setting-row > span {flex:1; min-width:0; font-size:18px; font-weight:560; color:#333333;}
.profile-setting-row > small {font-size:15px;color:#888888;white-space:nowrap;}
.profile-setting-row .row-chevron {width:20px;height:20px;color:#777777; flex:none;}
.profile-toggle {width:52px;height:30px;display:flex;align-items:center;padding:3px;border-radius:99px;background:#D9D9D9;transition:background .18s ease;flex:none;}
.profile-setting-row > .profile-toggle {width:52px;min-width:52px;max-width:52px;flex:0 0 52px;}
.profile-toggle i {width:24px;height:24px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.16);transition:transform .18s ease;}
.profile-toggle.on {background:#333333;justify-content:flex-end;}
.profile-logout {width:100%; min-height:80px; display:flex; align-items:center; gap:16px; padding:0 20px; margin-top:24px; border:1px solid #EEEEEE; border-radius:24px; background:#FFFFFF; color:#333333; text-align:left; font-size:18px; font-weight:560; box-shadow:0 5px 18px rgba(0,0,0,.035);}
.profile-logout svg {flex:none; color:#444444;}
.profile-options {display:grid;gap:9px;margin-top:15px;}
.profile-options button {min-height:48px;padding:0 14px;border:1px solid #EEEEEE;border-radius:14px;background:#F8F8F8;color:#333333;text-align:left;display:flex;justify-content:space-between;align-items:center;}
.profile-options button.selected {background:#EEEEEE;font-weight:620;}
.profile-edit-form {display:grid;gap:13px;margin-top:15px;}
.profile-edit-form label {display:grid;gap:6px;color:#888888;font-size:13px;}
.profile-edit-form input {height:46px;padding:0 13px;border:1px solid #E5E5E5;border-radius:12px;background:#FFFFFF;color:#333333;font-size:15px;}
.profile-edit-save {height:48px;border:0;border-radius:14px;background:#333333;color:#FFFFFF;font-size:15px;font-weight:600;}
.profile-logout-confirm {background:#333333!important;color:#FFFFFF!important;}
.app-shell:has(.account-page) {background:#FFFFFF;}
.app-shell:has(.account-page) > .status-bar {background:#FFFFFF;}
.account-page {min-height:calc(100dvh - 56px);margin:0 -16px;padding:0 20px 30px;background:#FFFFFF;color:#333333;display:flex;flex-direction:column;}

async function shareRecording(kind){
 const file=FILES.find(item=>item.id===state.recordingId);if(!file)return;
 const transcript=transcriptFor(file).map(segment=>segment.text).join('\n\n');
 const result=summaryFor(file),summary=[`讨论主题：${result.topic}`,`核心结论：\n${result.conclusions.map(item=>`• ${item}`).join('\n')}`,`后续安排：\n${result.actions.map(item=>`• ${item}`).join('\n')}`,`Mind map：${result.mindMap}`].join('\n\n');
 try{
  if(typeof navigator.share==='function'){
   if(kind==='audio'){
    const original=file.audioFile;
    const originalFile=typeof File==='function'&&original instanceof File?original:typeof File==='function'&&typeof Blob==='function'&&original instanceof Blob?new File([original],file.audioName||`${file.title}.audio`,{type:original.type||'application/octet-stream'}):null;
    if(originalFile){if(!navigator.canShare||navigator.canShare({files:[originalFile]})){await navigator.share({title:file.title,files:[originalFile]});showRecordingToast('已打开系统分享面板');return;}showRecordingToast('当前设备不支持分享音频文件');return;}
    await navigator.share({title:file.title,text:`录音导出演示：${file.title}。当前 Mock 数据未配置原始音频文件。`});showRecordingToast('已用 Mock 数据模拟导出入口');return;
   }
   await navigator.share({title:file.title,text:kind==='transcript'?transcript:summary});showRecordingToast('已打开系统分享面板');return;
  }
  if(kind==='audio'){showRecordingToast('当前开发环境没有原始音频资源，已保留 Mock 导出入口');return;}
  if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(kind==='transcript'?transcript:summary);showRecordingToast('当前环境不支持系统分享，文本已复制');return;}
  showRecordingToast('当前环境不支持系统分享');
 }catch(error){if(error?.name!=='AbortError')showRecordingToast('分享暂不可用，请稍后重试');}
}
