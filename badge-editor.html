<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8fb" />
  <meta name="description" content="JEETOO 墨水屏工卡编辑器交互原型。编辑时展示工卡外观，导出时仅输出内部屏幕内容。" />
  <title>JEETOO · 工卡编辑器 H5 原型（一级文字工具栏修正）</title>
  <style>
    :root { --ink:#17191c; --muted:#9399a4; --light:#f4f5f8; --border:#e9ebef; --shadow:0 12px 40px rgba(31,42,65,.065); --safe-bottom:env(safe-area-inset-bottom,0px); }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; min-height:100%; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); background:#e9ecf3; -webkit-font-smoothing:antialiased; }
    body { display:flex; align-items:center; justify-content:center; }
    button, input, textarea, select { font:inherit; }
    button { cursor:pointer; -webkit-tap-highlight-color:transparent; }
    svg.ico { width:22px; height:22px; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; fill:none; flex-shrink:0; }
    .phone { position:relative; width:min(100%,430px); height:100dvh; max-height:950px; overflow:hidden; background:#fafbfe; box-shadow:0 25px 100px rgba(40,50,70,.2); }
    @media (max-width:460px) { body { background:#fafbfe; } .phone { max-height:none; box-shadow:none; } }
    .screen { display:none; position:absolute; inset:0; background:#f9fafc; flex-direction:column; }
    .screen.active { display:flex; }
    .status { display:flex; align-items:center; justify-content:space-between; height:38px; flex-shrink:0; padding:9px 29px 1px; font-size:14px; font-weight:750; color:#12151a; letter-spacing:.1px; }
    .status-right { display:flex; align-items:center; gap:5px; }
    .status-right svg { width:17px; height:17px; }
    .battery { display:flex; align-items:center; width:22px; height:11px; border:1.65px solid #191919; border-radius:3px; padding:2px; position:relative; margin-left:3px; }
    .battery::after { content:""; width:2px; height:5px; background:#191919; position:absolute; right:-4px; border-radius:0 2px 2px 0; }
    .battery::before { content:""; display:block; width:13px; height:5px; background:#171717; border-radius:1px; }
    .nav { flex-shrink:0; height:65px; display:grid; grid-template-columns:50px 1fr 50px; align-items:center; padding:0 22px; }
    .nav h1 { text-align:center; font-size:21px; font-weight:730; letter-spacing:.3px; margin:0; }
    .icon-btn { background:transparent; border:0; display:flex; align-items:center; justify-content:center; padding:8px; color:#14171b; border-radius:12px; }
    .icon-btn:active { background:#eceef2; }
    .nav-action { background:transparent; border:0; color:#151515; font-size:14px; font-weight:700; padding:8px 0; }
    #manager { background:radial-gradient(circle at 50% 10%,#fff 0%,#f8f9fc 50%,#f6f7fb 100%); }
    .list-scroll { flex:1; overflow-y:auto; padding:13px 18px 20px; scrollbar-width:none; }
    .list-scroll::-webkit-scrollbar { display:none; }
    .badge-section-head { display:flex; align-items:center; min-height:36px; margin:0 2px 10px; }
    .badge-section-head h2 { margin:0; color:#17191c; font-size:18px; font-weight:720; }
    .badge-card, .personal-card { display:flex; align-items:center; gap:17px; background:#fff; border:1px solid #eff0f3; box-shadow:0 7px 20px rgba(32,44,70,.04); border-radius:22px; padding:18px 17px; min-height:171px; margin-bottom:14px; }
    .badge-card, .personal-card { cursor:pointer; transition:transform .12s ease; }
    .badge-card:active, .personal-card:active { transform:scale(.995); }
    .badge-card:focus-visible, .personal-card:focus-visible { outline:2px solid #aeb3bb; outline-offset:2px; }
    .badge-mini-wrap { width:100px; padding-top:10px; flex:none; position:relative; }
    .badge-mini-wrap::before { content:""; position:absolute; top:0; left:45px; z-index:3; width:13px; height:22px; background:linear-gradient(#272c32,#111 48%,#eef3fc 49%,#d9e2f1); border-radius:2px 2px 5px 5px; box-shadow:0 2px 4px rgba(0,0,0,.18); }
    .badge-mini { width:100px; height:auto; aspect-ratio:3 / 4; background:#fff; border-radius:13px; box-shadow:0 5px 12px rgba(23,28,44,.12); border:1px solid #e8ecf1; overflow:hidden; display:flex; align-items:center; justify-content:center; }
    .badge-mini img { display:block; width:100%; height:100%; object-fit:cover; }
    .card-main { flex:1; min-width:0; display:flex; flex-direction:column; align-self:stretch; padding:9px 0 0; }
    .card-head { display:flex; align-items:flex-start; justify-content:space-between; gap:6px; }
    .card-name { font-size:18px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:130px; }
    .pill { font-size:12px; white-space:nowrap; background:#f0f1f3; color:#666b74; border-radius:20px; padding:5px 9px; font-weight:700; }
    .pill.current { color:#fff; background:#17191c; }
    .pill.syncing { color:#3f434a; background:#e7e8eb; }
    .pill.failed { color:#4f535a; background:#e9e9eb; }
    .card-actions { display:flex; justify-content:flex-end; align-items:center; gap:6px; margin-top:auto; padding-bottom:4px; }
    .card-actions button { height:36px; border:0; background:#f5f6f9; border-radius:10px; font-size:12px; font-weight:600; padding:0 9px; color:#23262b; white-space:nowrap; }
    .card-actions button.dark { background:#161718; color:#fff; }
    .card-actions button:disabled { opacity:.48; cursor:default; }
    .card-actions button.square { padding:0 9px; }
    .card-actions svg { width:14px; height:14px; vertical-align:middle; }
    .badge-sync-progress {display:flex;align-items:center;gap:8px;margin-top:8px;color:#858a93;font-size:12px;}
    .badge-sync-progress .track {height:5px;flex:1;overflow:hidden;border-radius:99px;background:#e8e9ec;}
    .badge-sync-progress .track i {display:block;height:100%;border-radius:inherit;background:#17191c;transition:width .18s ease;}
    .bottom-fixed { flex-shrink:0; padding:10px 18px calc(18px + var(--safe-bottom)); background:linear-gradient(transparent,#f8f9fc 22%); }
    .big-primary { display:flex; align-items:center; justify-content:center; gap:11px; color:#fff; background:#18191b; border:0; border-radius:16px; width:100%; height:57px; font-size:17px; font-weight:650; box-shadow:0 12px 26px rgba(25,25,25,.09); }
    .big-primary svg { width:21px; height:21px; }
    .empty-card { text-align:center; padding:25px 20px; color:#9399a4; }
    .empty-card .ico { width:39px; height:39px; margin:0 auto 12px; }
    .personal-badges { margin:20px 0 0; padding-top:16px; border-top:1px solid #e6e8ec; }
    .personal-section-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 2px 10px; }
    .personal-section-head h2 { margin:0; color:#17191c; font-size:18px; font-weight:720; }
    .personal-preview { width:100px; height:auto; aspect-ratio:3 / 4; flex:none; overflow:hidden; border-radius:13px; background:#f0f1f3; border:1px solid #e8e9ec; box-shadow:0 5px 12px rgba(23,28,44,.10); }
    .personal-preview img { width:100%; height:100%; display:block; object-fit:cover; }
    .personal-card .card-main { padding:9px 0 0; }
    .personal-card .card-name { flex:1; min-width:0; max-width:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .personal-card .card-actions { flex-wrap:nowrap; justify-content:flex-end; align-items:center; gap:6px; }
    .personal-card .card-actions > button { height:36px; padding:0 9px; border-radius:10px; font-size:12px; }
    .personal-card .card-actions > button .ico { width:14px; height:14px; }
    .personal-more-wrap { position:relative; }
    .personal-more-button { width:36px; height:36px; display:grid; place-items:center; border:0; border-radius:10px; background:#f5f6f9; color:#353941; padding:0; }
    .personal-more-button .ico { width:18px; height:18px; stroke-width:2.2; }
    .personal-more-button:active { background:#e9eaed; }
    .personal-more-menu { position:absolute; z-index:20; bottom:calc(100% + 6px); right:0; min-width:136px; padding:5px; border:1px solid #eceef1; border-radius:12px; background:#fff; box-shadow:0 10px 28px rgba(25,30,40,.16); }
    .personal-more-menu[hidden] { display:none; }
    .personal-more-menu button { width:100%; height:38px; padding:0 12px; border:0; border-radius:8px; background:transparent; color:#34383f; text-align:left; font-size:14px; }
    .personal-more-menu button.danger { color:#c43d3d; }
    .personal-more-menu button + button { border-top:1px solid #f0f1f3; border-radius:0 0 8px 8px; }
    .personal-more-menu button:disabled { color:#a8abb1; }
    .personal-empty-state { display:flex; flex-direction:column; align-items:center; text-align:center; padding:24px 18px 20px; border:1px dashed #e5e7eb; border-radius:18px; background:#fff; }
    .personal-empty-state > .ico { width:28px; height:28px; margin-bottom:12px; color:#34383f; }
    .personal-empty-state strong { color:#17191c; font-size:15px; font-weight:680; }
    #badgeDetail { background:#f6f7fa; }
    .badge-detail-scroll { flex:1; min-height:0; overflow-y:auto; padding:18px 22px 24px; }
    .badge-detail-preview { width:min(100%,330px); aspect-ratio:3 / 4; margin:0 auto 22px; overflow:hidden; border:1px solid #e8e9ec; border-radius:16px; background:#fff; box-shadow:0 10px 28px rgba(32,44,70,.08); }
    .badge-detail-preview img { display:block; width:100%; height:100%; object-fit:contain; }
    .badge-detail-info { width:min(100%,420px); margin:0 auto; padding:14px 20px; border:1px solid #eceef1; border-radius:16px; background:#fff; }
    .badge-detail-title { max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:4px 10px; border:0; background:transparent; color:inherit; font:inherit; cursor:pointer; }
    .badge-detail-title:active { opacity:.66; }
    .badge-detail-row { display:flex; align-items:center; justify-content:space-between; gap:14px; color:#858a93; font-size:14px; }
    .badge-detail-row + .badge-detail-row { margin-top:12px; padding-top:12px; border-top:1px solid #f0f1f3; }
    .badge-detail-value { color:#25282e; font-weight:600; text-align:right; }
    .badge-detail-value .pill { display:inline-block; }
    .badge-detail-actions { flex:none; display:flex; gap:8px; margin:10px 14px calc(8px + var(--safe-bottom)); padding:9px; border:1px solid #eceef1; border-radius:20px; background:#fff; box-shadow:0 7px 22px rgba(32,44,70,.07); }
    .badge-detail-actions button { flex:1; min-width:0; display:flex; align-items:center; justify-content:center; gap:5px; height:48px; padding:0 6px; border:0; border-radius:13px; font-size:13px; font-weight:650; white-space:nowrap; }
    .badge-detail-actions button[hidden] { display:none; }
    .badge-detail-edit { background:#e9eaed; color:#25282e; }
    .badge-detail-delete { background:#fff0f0; color:#c43d3d; }
    .badge-detail-delete .ico { width:16px; height:16px; }
    .badge-detail-sync { background:#17191c; color:#fff; }
    .badge-detail-actions button:disabled { opacity:.55; cursor:default; }
    #enterpriseProfileEditor { background:radial-gradient(circle at 50% 12%,#fff 0%,#f8f9fc 58%,#f6f7fb 100%); }
    .enterprise-profile-scroll { flex:1; min-height:0; overflow-y:auto; padding:14px 14px 20px; }
    .enterprise-profile-card { margin-bottom:10px; padding:17px 18px; border:1px solid rgba(238,239,242,.9); border-radius:21px; background:rgba(255,255,255,.92); box-shadow:0 8px 24px rgba(32,44,70,.035); }
    .enterprise-profile-card > label, .enterprise-profile-label { display:block; margin:0 0 11px; color:#15171a; font-size:18px; font-weight:720; }
    .enterprise-avatar-row { min-height:126px; display:flex; align-items:center; justify-content:space-between; gap:18px; }
    .enterprise-avatar { width:110px; height:138px; flex:none; overflow:hidden; border-radius:15px; background:#e8eaf0; }
    .enterprise-avatar img { display:block; width:100%; height:100%; object-fit:cover; }
    .enterprise-change-photo { flex:1; min-height:58px; display:flex; justify-content:center; align-items:center; gap:12px; border:0; border-radius:17px; background:#f0f1f5; color:#17191c; font-size:17px; font-weight:620; }
    .enterprise-change-photo .ico { width:25px; height:25px; }
    .enterprise-profile-input { width:100%; height:54px; padding:0 15px; border:1px solid #dce0e8; border-radius:14px; outline:none; background:rgba(255,255,255,.62); color:#17191c; font-size:17px; }
    .enterprise-profile-input:focus { border-color:#9ba2ae; }
    .enterprise-profile-input[readonly] { color:#9297a2; background:#f0f1f5; }
    .enterprise-profile-save { flex:none; padding:12px 17px calc(16px + var(--safe-bottom)); background:transparent; }
    #personalCropScreen { background:#f6f7fa; }
    .personal-crop-nav { position:relative; z-index:1; grid-template-columns:64px minmax(0,1fr) 64px; padding:0 16px; }
    .personal-crop-nav .nav-action { font-size:14px; }
    .personal-crop-nav h1 { margin:0; text-align:center; font-size:17px; font-weight:720; }
    .personal-name-nav { min-width:0; display:flex; align-items:center; justify-content:center; }
    .personal-name-trigger { min-width:0; max-width:100%; display:inline-flex; align-items:center; justify-content:center; gap:5px; padding:7px 4px; border:0; background:transparent; color:#17191c; font-size:17px; font-weight:720; }
    .personal-name-trigger span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .personal-name-trigger .ico { width:15px; height:15px; }
    .personal-name-editor { width:100%; min-width:0; display:flex; align-items:center; justify-content:center; gap:3px; }
    .personal-name-editor[hidden] { display:none; }
    .personal-name-editor button { width:27px; height:32px; flex:none; display:grid; place-items:center; border:0; border-radius:9px; background:transparent; color:#555a62; padding:4px; }
    .personal-name-editor button .ico { width:17px; height:17px; }
    .personal-name-editor input { width:100%; min-width:0; height:36px; padding:0 7px; border:1px solid #dfe1e5; border-radius:10px; outline:none; background:#fff; color:#17191c; text-align:center; font-size:16px; font-weight:650; }
    .personal-name-editor input:focus { border-color:#9da1a8; }
    .crop-page-main { flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:18px 22px; }
    .personal-crop-frame { position:relative; width:min(100%,330px,calc(75dvh - 187.5px)); aspect-ratio:3 / 4; overflow:hidden; background:#dfe1e5; border-radius:3px; box-shadow:0 0 0 999px rgba(20,22,26,.28),0 12px 34px rgba(24,29,38,.12); touch-action:none; user-select:none; }
    .personal-crop-frame::after { content:""; position:absolute; inset:0; border:1px solid rgba(255,255,255,.85); pointer-events:none; }
    #personalCropImage { position:absolute; top:50%; left:50%; max-width:none; max-height:none; transform-origin:center center; pointer-events:none; user-select:none; -webkit-user-drag:none; }
    .crop-page-hint { position:relative; z-index:1; flex:none; padding:17px 16px calc(22px + var(--safe-bottom)); text-align:center; color:#9298a2; font-size:12px; }
    #personalPreviewScreen { background:#f6f7fa; }
    .personal-preview-main { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:18px 24px; }
    .personal-final-preview { width:min(100%,330px,54dvh); aspect-ratio:3 / 4; overflow:hidden; border-radius:14px; background:#fff; box-shadow:0 12px 32px rgba(24,29,38,.11); }
    .personal-final-preview img { display:block; width:100%; height:100%; object-fit:contain; }
    .personal-crop-actions { position:relative; z-index:1; flex:none; padding:12px 18px calc(16px + var(--safe-bottom)); background:#f6f7fa; }
    /* editor */
    #editor { background:#f6f7fa; }
    .editor-nav { height:58px; grid-template-columns:74px minmax(0,1fr) 74px; padding:0 20px; }
    .editor-nav #editorBack { width:44px; height:44px; padding:0; justify-self:center; border-radius:12px; }
    .editor-nav #editorBack .ico { width:26px; height:26px; stroke-width:2.35; }
    .editor-nav h1 { font-size:17px; font-weight:720; }

    .editor-nav h1 { min-width:0; }
    .editor-name-trigger {
      max-width:100%; display:inline-flex; align-items:center; justify-content:center;
      gap:5px; padding:5px 2px; border:0; background:transparent;
      color:#17191c; font:inherit; font-size:17px; font-weight:720;
      letter-spacing:.2px; white-space:nowrap;
    }
    .editor-name-trigger span {
      display:block; max-width:150px; overflow:hidden;
      text-overflow:ellipsis; white-space:nowrap;
    }
    .editor-name-trigger .ico {
      width:14px; height:14px; flex:none; color:#858c96; stroke-width:1.9;
    }
    .editor-name-trigger:active { opacity:.65; }

    .editor-nav .save { background:#171819; color:#fff; border-radius:12px; padding:10px 14px; font-size:13px; min-width:66px; justify-self:end; white-space:nowrap; line-height:1.1; }
    .editor-nav .save[data-sync-save="true"] { padding:10px 6px; font-size:11px; max-width:calc(100vw - 150px); }
    .meta-row { display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:42px; padding:0 20px 8px; flex-shrink:0; }
    .rename { display:flex; align-items:center; gap:5px; flex:1 1 auto; min-width:0; max-width:none; border:0; color:#868d98; padding:0; background:transparent; font-size:12px; text-align:left; }
    #badgeName { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .rename svg { width:13px; height:13px; }
    .actions-top { display:flex; gap:5px; align-items:center; flex-shrink:0; }
    .top-tool { height:34px; min-width:50px; display:flex; align-items:center; justify-content:center; gap:4px; padding:0 8px; border:0; background:#eceef2; border-radius:10px; color:#515863; font-size:11px; white-space:nowrap; }
    .top-tool svg { width:15px; height:15px; }
    .top-tool:disabled { opacity:.32; cursor:default; }
    .editor-nav .save:disabled { background:#e6e8ec; color:#a4aab3; box-shadow:none; cursor:default; }
    .workspace { position:relative; flex:1; min-height:0; overflow:hidden; display:flex; align-items:center; justify-content:center; padding:16px 16px 104px; background:radial-gradient(ellipse at 55% 40%,#eff1f5,#f6f7fa 64%); }
    .work-bg { position:absolute; inset:0; pointer-events:none; background-image:radial-gradient(#d9dfe7 .65px,transparent .65px); background-size:16px 16px; opacity:.32; mask-image:linear-gradient(to bottom, transparent 0%,black 17%,black 83%,transparent 100%); }
    /* Device-style badge shell: the outer hardware frame is preview-only; the inner screen is the editable/exported canvas. */
    #canvasScaler { position:relative; flex:none; width:340px; height:500px; transform:translateY(clamp(-60px, -7vh, -36px)); background:transparent; border-radius:30px; filter:drop-shadow(0 13px 28px rgba(34,44,56,.14)); }
    #canvasScaler::before { content:""; position:absolute; inset:0; z-index:0; border:2px solid #aeb2b6; border-radius:30px; background:linear-gradient(145deg,#fbfbfb 0%,#e9ebed 18%,#fff 38%,#f0f1f2 72%,#fafafa 100%); box-shadow:inset 0 0 0 3px rgba(255,255,255,.82),inset 0 1px 5px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.08); pointer-events:none; }
    #canvasScaler::after { content:""; position:absolute; z-index:3; left:50%; top:3.2%; width:18%; height:3.1%; transform:translateX(-50%); border:2px solid #b5b8bb; border-radius:14px; background:linear-gradient(#fdfdfd,#f2f3f4); box-shadow:inset 0 1px 2px rgba(0,0,0,.12),0 1px 1px rgba(255,255,255,.9); pointer-events:none; }
    .device-side-button { position:absolute; z-index:2; right:-2px; width:4px; border-radius:0 3px 3px 0; background:linear-gradient(90deg,#969a9e,#e2e4e6); box-shadow:1px 0 1px rgba(0,0,0,.12); pointer-events:none; }
    .device-side-button.one { top:34%; height:7%; }
    .device-side-button.two { top:44%; height:5%; }
    #badgeCanvas { width:300px; height:420px; overflow:hidden; position:absolute; left:20px; top:58px; z-index:1; background:#fff; border:1px solid #e1e3e6; border-radius:8px; box-shadow:0 0 0 1px rgba(0,0,0,.025),inset 0 1px 2px rgba(0,0,0,.025); transform-origin:top left; touch-action:none; }
    #badgeBg { position:absolute; inset:0; border-radius:7px; background:#fff; background-position:center; background-size:cover; pointer-events:none; }
    .canvas-hint { position:absolute; top:49%; left:50%; transform:translate(-50%,-50%); text-align:center; width:220px; pointer-events:none; color:#b2b7bf; }
    .canvas-hint svg { width:39px; height:39px; margin-bottom:8px; stroke-width:1.2; }
    .canvas-hint div { font-size:14px; font-weight:550; color:#969da8; }
    .canvas-hint small { display:block; margin-top:8px; font-size:11px; color:#b7bec8; }
    .design-element { position:absolute; transform-origin:center center; user-select:none; touch-action:none; cursor:move; }
    .design-element .text-content { display:flex; align-items:center; justify-content:center; width:100%; height:100%; box-sizing:border-box; text-align:center; white-space:pre-wrap; overflow:hidden; line-height:1.2; overflow-wrap:anywhere; pointer-events:none; }
    .design-element .img-content { width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
    .design-element .line-content { display:block; position:absolute; top:50%; width:100%; transform:translateY(-50%); pointer-events:none; }
    .design-element.selected::after { content:""; position:absolute; inset:-2px; outline:1.8px solid #2774e7; pointer-events:none; }
    .line-element.selected::after { display:none; }
    .line-element .line-content { border-radius:999px; }
    .handle { position:absolute; display:none; width:12px; height:12px; background:#fff; border:2px solid #2774e7; border-radius:50%; z-index:8; pointer-events:auto; touch-action:none; }

      if(pendingBadgeDetailRename){
        const detail=pendingBadgeDetailRename,index=detail.type==='personal'?personalBadges.findIndex(item=>item.badgeId===detail.id):badges.findIndex(item=>item.id===detail.id);
        if(index<0){pendingBadgeDetailRename=null;hideOverlay('nameOverlay');return;}
        const previous=detail.type==='personal'?personalBadges:badges;
        if(detail.type==='personal')personalBadges=personalBadges.map((item,i)=>i===index?personalMetadata({...item,badgeName:val,name:val},item.syncStatus):item);
        else badges=badges.map((item,i)=>i===index?{...badgeMetadata({...item,name:val},item.syncStatus),isCurrentDisplay:item.isCurrentDisplay}:item);
        if(!persist()){if(detail.type==='personal')personalBadges=previous;else badges=previous;return;}
        pendingBadgeDetailRename=null;hideOverlay('nameOverlay');$('#nameOverlay h3').textContent='工卡名称';$('#applyName').textContent='确定';renderList(true);renderBadgeDetail();toast('名称已更新');return;
      }
      if(pendingPersonalRenameId){
        const id=pendingPersonalRenameId,index=personalBadges.findIndex(item=>item.badgeId===id);pendingPersonalRenameId=null;
        if(index<0){hideOverlay('nameOverlay');return;}
        const previous=personalBadges;personalBadges=personalBadges.map((item,i)=>i===index?personalMetadata({...item,badgeName:val,name:val}):item);
        if(!persist()){personalBadges=previous;return;}
        hideOverlay('nameOverlay');renderList(true);toast('名称已更新');return;
      }
      remember();model.name=val;$('#badgeName').textContent=val;hideOverlay('nameOverlay');
    };
    $$('[data-close]').forEach(b=>b.onclick=()=>{if(b.dataset.close==='nameOverlay'){pendingPersonalRenameId=null;pendingBadgeDetailRename=null;pendingPersonalPreviewNameEdit=false;$('#nameOverlay h3').textContent='工卡名称';$('#applyName').textContent='确定';}hideOverlay(b.dataset.close);});
    $('#confirmAccept').onclick=()=>{hideOverlay('confirmOverlay');const fn=confirmCallback;confirmCallback=null;fn?.();};
    $$('.dock-item').forEach(btn=>btn.addEventListener('click',()=>{if(!model)return;switch(btn.dataset.tool){case 'text':addText();break;case 'image':pickerMode='new';$('#imagePicker').value='';$('#imagePicker').click();break;case 'line':addLine();break;case 'background':selectedId=null;$$('.design-element').forEach(el=>el.classList.remove('selected'));bgTab=model.bg.image?'image':'color';showBgSheet();break;}}));
    $('#imagePicker').onchange=e=>onImagePicked(e.target.files[0],false);
    $('#bgPicker').onchange=e=>onImagePicked(e.target.files[0],true);
    $('#personalImagePicker').onchange=e=>{
      const file=e.target.files?.[0],replaceId=pendingPersonalReplaceId;pendingPersonalReplaceId=null;
      if(!file)return;
      const reader=new FileReader();reader.onload=()=>openPersonalCrop(String(reader.result||''),replaceId);reader.onerror=()=>toast('无法读取该图片');reader.readAsDataURL(file);
    };
    $('#enterpriseProfileChangePhoto').onclick=()=>{if(!enterpriseProfileDraft)return;$('#enterpriseProfileImagePicker').value='';$('#enterpriseProfileImagePicker').click();};
    $('#enterpriseProfileImagePicker').onchange=e=>{
      const file=e.target.files?.[0];if(!file||!enterpriseProfileDraft)return;
      const reader=new FileReader();reader.onload=()=>{enterpriseProfileDraft.avatarSrc=String(reader.result||'');$('#enterpriseProfileAvatar').src=enterpriseProfileDraft.avatarSrc;};reader.onerror=()=>toast('无法读取该图片');reader.readAsDataURL(file);
    };
    $('#enterpriseProfileBack').onclick=returnFromEnterpriseProfile;
    $('#enterpriseProfileSave').onclick=saveEnterpriseProfile;
    // Permanent delegation on the list container keeps this direct upload route alive after every list refresh.
    $('#badgeList').addEventListener('click',event=>{
      const more=event.target.closest('[data-personal-more]');
      if(more){event.preventDefault();event.stopPropagation();const card=more.closest('.personal-card'),menu=card?.querySelector('.personal-more-menu'),opening=Boolean(menu?.hidden);$$('.personal-more-menu').forEach(item=>item.hidden=true);if(menu){menu.hidden=!opening;more.setAttribute('aria-expanded',String(opening));}return;}
      const rename=event.target.closest('[data-personal-rename]');
      if(rename){event.preventDefault();event.stopPropagation();const menu=rename.closest('.personal-more-menu');if(menu)menu.hidden=true;menu?.closest('.personal-more-wrap')?.querySelector('[data-personal-more]')?.setAttribute('aria-expanded','false');openPersonalRename(rename.dataset.personalRename);return;}
      const remove=event.target.closest('[data-personal-delete]');
      if(remove){event.preventDefault();event.stopPropagation();const menu=remove.closest('.personal-more-menu');if(menu)menu.hidden=true;menu?.closest('.personal-more-wrap')?.querySelector('[data-personal-more]')?.setAttribute('aria-expanded','false');requestPersonalDelete(remove.dataset.personalDelete);return;}
      const replace=event.target.closest('[data-personal-replace]');
      if(replace){event.preventDefault();event.stopPropagation();openPersonalPicker(replace.dataset.personalReplace);return;}
      const sync=event.target.closest('[data-personal-sync]');
      if(sync){event.preventDefault();event.stopPropagation();requestBadgeSync(sync.dataset.personalSync,'personal');}
      const card=event.target.closest('[data-badge-card]');
      if(!card||event.target.closest('button,a,input,textarea,select,[data-action],.card-actions,.personal-more-wrap'))return;
      event.preventDefault();openBadgeDetail(card.dataset.badgeCard);
    });
    $('#badgeList').addEventListener('keydown',event=>{
      const card=event.target.closest('[data-badge-card]');
      if(!card||event.target!==card||!['Enter',' '].includes(event.key))return;
      event.preventDefault();openBadgeDetail(card.dataset.badgeCard);
    });
    $('#badgeDetailBack').onclick=closeBadgeDetail;
    $('#badgeDetailTitle').onclick=openBadgeDetailRename;
    $('#badgeDetailEdit').onclick=editBadgeDetail;
    $('#badgeDetailDelete').onclick=()=>{if(activeBadgeDetail?.type==='personal')requestPersonalDelete(activeBadgeDetail.id);};
    $('#badgeDetailSync').onclick=syncBadgeDetail;
    document.addEventListener('pointerdown',event=>{if(event.target.closest('.personal-more-wrap'))return;$$('.personal-more-menu').forEach(menu=>menu.hidden=true);$$('[data-personal-more]').forEach(button=>button.setAttribute('aria-expanded','false'));});
    $('#personalCropCancel').onclick=cancelPersonalCrop;$('#personalCropDone').onclick=finishPersonalCrop;
    $('#personalPreviewBack').onclick=()=>openPage('personal-crop');
    $('#personalConfirmAdd').onclick=confirmPersonalBadge;
    $('#personalNameTrigger').onclick=openPersonalNameEditor;
    $('#personalNameConfirm').onclick=()=>confirmPersonalNameEdit(false);
    $('#personalNameCancel').onclick=cancelPersonalNameEdit;
    $('#personalNameInput').addEventListener('keydown',event=>{
      if(event.key==='Enter'){event.preventDefault();confirmPersonalNameEdit(false);}
      if(event.key==='Escape'){event.preventDefault();cancelPersonalNameEdit();}
    });
    document.addEventListener('pointerdown',event=>{
      if(!personalPreviewState||$('#personalNameEditor').hidden||$('#personalNameEditor').contains(event.target))return;
      confirmPersonalNameEdit(true);
    });
    $('#personalCropFrame').addEventListener('pointerdown',personalCropPointerDown);
    $('#personalCropFrame').addEventListener('pointermove',personalCropPointerMove);
    $('#personalCropFrame').addEventListener('pointerup',personalCropPointerEnd);
    $('#personalCropFrame').addEventListener('pointercancel',personalCropPointerEnd);
    $('#badgeCanvas').addEventListener('pointerdown',canvasGroupPointerDown,true);
    $('#badgeCanvas').addEventListener('pointermove',canvasGroupPointerMove);
    $('#badgeCanvas').addEventListener('pointerup',canvasGroupPointerEnd);
    $('#badgeCanvas').addEventListener('pointercancel',canvasGroupPointerEnd);
    $$('[data-layer]').forEach(b=>b.onclick=()=>layerMove(b.dataset.layer));
    $('#cropZoom').oninput=e=>{cropState.zoom=Number(e.target.value);renderCrop();};$('#applyCrop').onclick=applyCrop;
    let cropDrag=null;$('#cropFrame').addEventListener('pointerdown',e=>{cropDrag={x:e.clientX,y:e.clientY,ox:cropState.offsetX,oy:cropState.offsetY};e.currentTarget.setPointerCapture(e.pointerId);});
    $('#cropFrame').addEventListener('pointermove',e=>{if(!cropDrag)return;cropState.offsetX=cropDrag.ox+(e.clientX-cropDrag.x);cropState.offsetY=cropDrag.oy+(e.clientY-cropDrag.y);renderCrop();});
    $('#cropFrame').addEventListener('pointerup',()=>cropDrag=null);$('#cropFrame').addEventListener('pointercancel',()=>cropDrag=null);
    window.addEventListener('resize',()=>{if(mode==='editor')fitCanvas();});
    window.addEventListener('keydown',e=>{if(mode!=='editor'||e.target.matches('input,textarea,select'))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();}if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();removeSelected();}if(e.key==='Escape'){selectedId=null;renderEditor();}});
    loadBadges();renderList();
  })();
  </script>
</body>
</html>
